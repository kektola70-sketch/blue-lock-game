<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Blue Lock: Awakening</title>
<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:black;
    z-index:10;
}

button{
    padding:12px 25px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
    background:#111;
    color:white;
    border:2px solid white;
}

button:hover{
    background:white;
    color:black;
}

#result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

#gameCanvas{
    display:block;
}
</style>
</head>
<body>

<!-- ВСТУПЛЕНИЕ -->
<div id="intro" class="screen">
    <h1>Ты вошёл в Blue Lock</h1>
    <p>У тебя один шанс.</p>
    <button onclick="startGacha()">Пробудиться</button>
</div>

<!-- GACHA -->
<div id="gacha" class="screen" style="display:none;">
    <h1>Пробуждение</h1>
    <p id="spinInfo"></p>
    <button onclick="rollNormal()">Обычный спин</button>
    <button onclick="rollLucky()">🌟 Удачливый спин</button>
    <div id="result"></div>
</div>

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ---------------- GACHA ---------------- */

let normalSpins = 10;
let luckySpins = 1;
let awakening = null;

const normalTable = [
{rarity:"Обычный", chance:50, rewards:["Подражатель","Нет","Скорость"]},
{rarity:"Необычный", chance:25, rewards:["Дриблинг","Цепь"]},
{rarity:"Редкий", chance:10, rewards:["Поток Змеи","Поток Хамелеона"]},
{rarity:"Эпик", chance:5, rewards:["Поток Пантеры"]},
{rarity:"Легендарный", chance:2.5, rewards:["Поток Гения","Поток Императора","Поток Пазлов","Поток Младшего"]},
{rarity:"Мировой класс", chance:1, rewards:["Божественная скорость","Поток Цантора"]}
];

const luckyTable = [
{rarity:"Эпик", chance:65, rewards:["Поток Пантеры"]},
{rarity:"Легендарный", chance:25, rewards:["Поток Гения","Поток Императора","Поток Пазлов","Поток Младшего"]},
{rarity:"Мировой класс", chance:10, rewards:["Божественная скорость","Поток Цантора"]}
];

function startGacha(){
    document.getElementById("intro").style.display="none";
    document.getElementById("gacha").style.display="flex";
    updateInfo();
}

function updateInfo(){
    document.getElementById("spinInfo").innerText =
    "Обычные: "+normalSpins+" | Удачливые: "+luckySpins;
}

function rollNormal(){
    if(normalSpins<=0) return;
    normalSpins--;
    roll(normalTable);
}

function rollLucky(){
    if(luckySpins<=0) return;
    luckySpins--;
    roll(luckyTable);
}

function roll(table){
    let rand = Math.random()*100;
    let sum = 0;

    for(let item of table){
        sum += item.chance;
        if(rand <= sum){
            let reward = item.rewards[
                Math.floor(Math.random()*item.rewards.length)
            ];
            awakening = reward;
            document.getElementById("result").innerText =
            "🔥 "+item.rarity+" — "+reward+
            "\n\nНажми чтобы начать обучение";

            setTimeout(()=>{
                startTraining();
            },2000);

            break;
        }
    }
    updateInfo();
}

/* ---------------- 3D ОБУЧЕНИЕ ---------------- */

let scene, camera, renderer;
let player, ball, goal;
let keys = {};

function startTraining(){
    document.getElementById("gacha").style.display="none";

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101820);

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Свет
    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(10,20,10);
    scene.add(light);

    const ambient = new THREE.AmbientLight(0x404040);
    scene.add(ambient);

    // Поле
    const fieldGeo = new THREE.PlaneGeometry(60,40);
    const fieldMat = new THREE.MeshStandardMaterial({color:0x0b6623});
    const field = new THREE.Mesh(fieldGeo, fieldMat);
    field.rotation.x = -Math.PI/2;
    scene.add(field);

    // Игрок
    const playerGeo = new THREE.BoxGeometry(1,2,1);
    const playerMat = new THREE.MeshStandardMaterial({color:0x00aaff});
    player = new THREE.Mesh(playerGeo, playerMat);
    player.position.y = 1;
    scene.add(player);

    // Мяч
    const ballGeo = new THREE.SphereGeometry(0.5,32,32);
    const ballMat = new THREE.MeshStandardMaterial({color:0xffffff});
    ball = new THREE.Mesh(ballGeo, ballMat);
    ball.position.set(0,0.5,-5);
    scene.add(ball);

    // Ворота
    const goalGeo = new THREE.BoxGeometry(6,3,1);
    const goalMat = new THREE.MeshStandardMaterial({color:0xffffff});
    goal = new THREE.Mesh(goalGeo, goalMat);
    goal.position.set(0,1.5,-20);
    scene.add(goal);

    camera.position.set(0,5,10);

    document.addEventListener("keydown", e=>keys[e.key]=true);
    document.addEventListener("keyup", e=>keys[e.key]=false);

    animate();
}

function animate(){
    requestAnimationFrame(animate);

    // Управление
    if(keys["w"]) player.position.z -= 0.2;
    if(keys["s"]) player.position.z += 0.2;
    if(keys["a"]) player.position.x -= 0.2;
    if(keys["d"]) player.position.x += 0.2;

    // Камера следует
    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 10;
    camera.lookAt(player.position);

    // Удар
    if(keys[" "]){
        let distance = player.position.distanceTo(ball.position);
        if(distance < 2){
            ball.position.z -= 1;
        }
    }

    // Проверка гола
    if(ball.position.z < -19){
        alert("⚽ ГОЛ!\nОбучение завершено.\nТвоё пробуждение: "+awakening);
        location.reload();
    }

    renderer.render(scene,camera);
}

</script>
</body>
</html>
