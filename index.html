<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Blue Lock Ultimate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial}

/* ЭКРАНЫ */
.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
color:white;
z-index:10;
text-align:center;
}

button{
padding:12px 25px;
margin:10px;
font-size:18px;
cursor:pointer;
}

/* UI */
#ui{position:absolute;width:100%;height:100%;pointer-events:none;}

#joystick{
position:absolute;
bottom:40px;
left:40px;
width:120px;
height:120px;
background:rgba(255,255,255,0.1);
border-radius:50%;
pointer-events:auto;
touch-action:none;
}

#stick{
position:absolute;
width:60px;height:60px;
background:white;border-radius:50%;
left:30px;top:30px;
}

#jumpBtn{
position:absolute;
bottom:60px;
right:60px;
width:100px;height:100px;
border-radius:50%;
background:rgba(0,150,255,0.7);
color:white;font-size:18px;
border:none;
pointer-events:auto;
}
</style>
</head>
<body>

<!-- ЗАСТАВКА -->
<div id="intro" class="screen">
<h1>BLUE LOCK</h1>
<p>У тебя один шанс.</p>
<button onclick="startGacha()">Пробудиться</button>
</div>

<!-- GACHA -->
<div id="gacha" class="screen" style="display:none;">
<h2>Пробуждение</h2>
<p id="spins"></p>
<button onclick="rollNormal()">Обычный спин</button>
<button onclick="rollLucky()">Удачливый спин</button>
<h3 id="result"></h3>
</div>

<!-- UI MOBILE -->
<div id="ui" style="display:none;">
<div id="joystick"><div id="stick"></div></div>
<button id="jumpBtn">JUMP</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ------------------ GACHA ------------------ */

let normalSpins=10;
let luckySpins=1;
let awakening=null;

const normalTable=[
{rarity:"Обычный",chance:50,rewards:["Подражатель","Скорость"]},
{rarity:"Необычный",chance:25,rewards:["Дриблинг","Цепь"]},
{rarity:"Редкий",chance:10,rewards:["Поток Змеи","Поток Хамелеона"]},
{rarity:"Эпик",chance:5,rewards:["Поток Пантеры"]},
{rarity:"Легендарный",chance:2.5,rewards:["Поток Гения","Поток Императора"]},
{rarity:"Мировой класс",chance:1,rewards:["Божественная скорость","Поток Цантора"]}
];

const luckyTable=[
{rarity:"Эпик",chance:65,rewards:["Поток Пантеры"]},
{rarity:"Легендарный",chance:25,rewards:["Поток Гения","Поток Императора"]},
{rarity:"Мировой класс",chance:10,rewards:["Божественная скорость","Поток Цантора"]}
];

function startGacha(){
intro.style.display="none";
gacha.style.display="flex";
updateSpins();
}

function updateSpins(){
spins.innerText="Обычные:"+normalSpins+" | Удачливые:"+luckySpins;
}

function rollNormal(){if(normalSpins<=0)return;normalSpins--;roll(normalTable);}
function rollLucky(){if(luckySpins<=0)return;luckySpins--;roll(luckyTable);}

function roll(table){
let rand=Math.random()*100,sum=0;
for(let item of table){
sum+=item.chance;
if(rand<=sum){
awakening=item.rewards[Math.floor(Math.random()*item.rewards.length)];
result.innerText=item.rarity+" — "+awakening;
setTimeout(startGame,2000);
break;
}}
updateSpins();
}

/* ------------------ 3D GAME ------------------ */

let scene,camera,renderer;
let player,ball,goal;
let moveX=0,moveZ=0;
let velocityY=0,onGround=true;
let hasBall=false;

function startGame(){
gacha.style.display="none";
ui.style.display="block";

scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);

camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

/* Свет */
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(100,200,100);
sun.castShadow=true;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,0.4));

/* Поле */
const field=new THREE.Mesh(
new THREE.PlaneGeometry(300,200),
new THREE.MeshStandardMaterial({color:0x1e7b1e})
);
field.rotation.x=-Math.PI/2;
field.receiveShadow=true;
scene.add(field);

/* Стадион */
const stadium=new THREE.Mesh(
new THREE.CylinderGeometry(160,160,40,64,1,true),
new THREE.MeshStandardMaterial({color:0x222222,side:THREE.DoubleSide})
);
stadium.position.y=20;
scene.add(stadium);

/* Игрок */
player=new THREE.Mesh(
new THREE.CapsuleGeometry(0.5,1.5,8,16),
new THREE.MeshStandardMaterial({color:0x00aaff})
);
player.position.y=1;
player.castShadow=true;
scene.add(player);

/* Мяч */
ball=new THREE.Mesh(
new THREE.SphereGeometry(0.5,32,32),
new THREE.MeshStandardMaterial({color:0xffffff})
);
ball.position.set(0,0.5,-10);
ball.castShadow=true;
scene.add(ball);

/* Ворота */
goal=new THREE.Mesh(
new THREE.BoxGeometry(10,5,1),
new THREE.MeshStandardMaterial({color:0xffffff})
);
goal.position.set(0,2.5,-80);
scene.add(goal);

camera.position.set(0,6,12);

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

animate();
}

let keys={};

/* ----------- JOYSTICK ----------- */

joystick.addEventListener("touchstart",()=>drag=true);
joystick.addEventListener("touchend",()=>{
drag=false;moveX=0;moveZ=0;
stick.style.left="30px";stick.style.top="30px";
});

let drag=false;
joystick.addEventListener("touchmove",(e)=>{
if(!drag)return;
let r=joystick.getBoundingClientRect();
let x=e.touches[0].clientX-r.left-60;
let y=e.touches[0].clientY-r.top-60;
let d=Math.sqrt(x*x+y*y);
let max=40;
if(d>max){x=x/d*max;y=y/d*max;}
stick.style.left=(x+30)+"px";
stick.style.top=(y+30)+"px";
moveX=x/40;moveZ=y/40;
});

/* Прыжок */
jumpBtn.onclick=()=>{
if(onGround){velocityY=0.3;onGround=false;}
};

/* ----------- LOOP ----------- */

function animate(){
requestAnimationFrame(animate);

/* Движение */
if(keys["w"])moveZ=-1;
if(keys["s"])moveZ=1;
if(keys["a"])moveX=-1;
if(keys["d"])moveX=1;

player.position.x+=moveX*0.4;
player.position.z+=moveZ*0.4;

moveX*=0.8;moveZ*=0.8;

/* Гравитация */
player.position.y+=velocityY;
velocityY-=0.015;
if(player.position.y<=1){player.position.y=1;velocityY=0;onGround=true;}

/* Камера */
camera.position.x=player.position.x;
camera.position.z=player.position.z+12;
camera.lookAt(player.position);

/* Взятие мяча */
if(player.position.distanceTo(ball.position)<2){
hasBall=true;
}
if(hasBall){
ball.position.x=player.position.x;
ball.position.z=player.position.z-1;
}

/* Удар */
if(keys["f"] && hasBall){
hasBall=false;
ball.position.z-=5;
}

/* Гол */
if(ball.position.z<-75){
alert("⚽ ГОЛ!");
ball.position.set(0,0.5,-10);
hasBall=false;
}

renderer.render(scene,camera);
}

</script>
</body>
</html>
