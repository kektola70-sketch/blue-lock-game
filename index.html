<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Blue Lock 3D Training</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:black;
}

/* UI */
#ui{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* Джойстик */
#joystick{
    position:absolute;
    bottom:40px;
    left:40px;
    width:120px;
    height:120px;
    background:rgba(255,255,255,0.1);
    border-radius:50%;
    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    width:60px;
    height:60px;
    background:white;
    border-radius:50%;
    left:30px;
    top:30px;
}

/* Кнопка прыжка */
#jumpBtn{
    position:absolute;
    bottom:60px;
    right:60px;
    width:100px;
    height:100px;
    border-radius:50%;
    background:rgba(0,150,255,0.7);
    color:white;
    font-size:20px;
    border:none;
    pointer-events:auto;
}

</style>
</head>
<body>

<div id="ui">
    <div id="joystick">
        <div id="stick"></div>
    </div>
    <button id="jumpBtn">JUMP</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ---------- THREE SETUP ---------- */

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

let camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- LIGHT ---------- */

const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(50,100,50);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff,0.4));

/* ---------- FIELD ---------- */

const fieldGeo = new THREE.PlaneGeometry(200,200);
const fieldMat = new THREE.MeshStandardMaterial({
    color:0x1e7b1e,
    roughness:0.6,
    metalness:0.1
});
const field = new THREE.Mesh(fieldGeo,fieldMat);
field.rotation.x = -Math.PI/2;
field.receiveShadow = true;
scene.add(field);

/* ---------- PLAYER ---------- */

const playerGeo = new THREE.BoxGeometry(1,2,1);
const playerMat = new THREE.MeshStandardMaterial({color:0x00aaff});
const player = new THREE.Mesh(playerGeo,playerMat);
player.position.y = 1;
player.castShadow = true;
scene.add(player);

/* ---------- BALL ---------- */

const ballGeo = new THREE.SphereGeometry(0.5,32,32);
const ballMat = new THREE.MeshStandardMaterial({
    color:0xffffff,
    roughness:0.3,
    metalness:0.2
});
const ball = new THREE.Mesh(ballGeo,ballMat);
ball.position.set(0,0.5,-10);
ball.castShadow = true;
ball.receiveShadow = true;
scene.add(ball);

/* ---------- GOAL ---------- */

const goalGeo = new THREE.BoxGeometry(8,4,1);
const goalMat = new THREE.MeshStandardMaterial({color:0xffffff});
const goal = new THREE.Mesh(goalGeo,goalMat);
goal.position.set(0,2,-40);
goal.castShadow = true;
scene.add(goal);

/* ---------- CONTROLS ---------- */

let moveX = 0;
let moveZ = 0;
let velocityY = 0;
let onGround = true;

/* ПК управление */
let keys = {};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

/* ---------- JOYSTICK ---------- */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let dragging = false;

joystick.addEventListener("touchstart",()=>dragging=true);
joystick.addEventListener("touchend",()=>{
    dragging=false;
    moveX=0; moveZ=0;
    stick.style.left="30px";
    stick.style.top="30px";
});

joystick.addEventListener("touchmove",(e)=>{
    if(!dragging) return;
    let rect = joystick.getBoundingClientRect();
    let x = e.touches[0].clientX - rect.left - 60;
    let y = e.touches[0].clientY - rect.top - 60;

    let dist = Math.sqrt(x*x+y*y);
    let max = 40;
    if(dist>max){
        x = x/dist*max;
        y = y/dist*max;
    }

    stick.style.left = (x+30)+"px";
    stick.style.top = (y+30)+"px";

    moveX = x/40;
    moveZ = y/40;
});

/* ---------- JUMP BUTTON ---------- */

document.getElementById("jumpBtn").addEventListener("touchstart",jump);
document.getElementById("jumpBtn").addEventListener("click",jump);

function jump(){
    if(onGround){
        velocityY = 0.3;
        onGround=false;
    }
}

/* ---------- GAME LOOP ---------- */

camera.position.set(0,5,10);

function animate(){
    requestAnimationFrame(animate);

    /* ПК движение */
    if(keys["w"]) player.position.z -= 0.3;
    if(keys["s"]) player.position.z += 0.3;
    if(keys["a"]) player.position.x -= 0.3;
    if(keys["d"]) player.position.x += 0.3;
    if(keys[" "]) jump();

    /* Мобильное движение */
    player.position.x += moveX*0.3;
    player.position.z += moveZ*0.3;

    /* Гравитация */
    player.position.y += velocityY;
    velocityY -= 0.01;

    if(player.position.y<=1){
        player.position.y=1;
        velocityY=0;
        onGround=true;
    }

    /* Камера */
    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 10;
    camera.lookAt(player.position);

    /* Удар */
    if(player.position.distanceTo(ball.position)<2){
        if(keys["f"]){
            ball.position.z -= 1;
        }
    }

    /* Гол */
    if(ball.position.z<-38){
        alert("⚽ ГОЛ!!!");
        ball.position.set(0,0.5,-10);
    }

    renderer.render(scene,camera);
}

animate();

</script>
</body>
</html>
