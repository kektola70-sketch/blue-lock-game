<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Lock Mobile Stable</title>
<style>
body{margin:0;overflow:hidden;background:black}
canvas{display:block}

/* UI */
#ui{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
}

#joystick{
position:absolute;
bottom:40px;
left:40px;
width:120px;height:120px;
background:rgba(255,255,255,0.15);
border-radius:50%;
pointer-events:auto;
}

#stick{
position:absolute;
width:60px;height:60px;
background:white;border-radius:50%;
left:30px;top:30px;
}

#jumpBtn{
position:absolute;
bottom:60px;right:60px;
width:90px;height:90px;
border-radius:50%;
background:rgba(0,150,255,0.8);
color:white;font-size:18px;
border:none;
pointer-events:auto;
}
</style>
</head>
<body>

<div id="ui">
<div id="joystick"><div id="stick"></div></div>
<button id="jumpBtn">JUMP</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>

<script>

/* ПРОВЕРКА WEBGL */
if(!WEBGL.isWebGLAvailable){
alert("WebGL не поддерживается");
}

/* СЦЕНА */
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

let camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,5,10);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

/* СВЕТ */
scene.add(new THREE.AmbientLight(0xffffff,0.8));

/* ПОЛЕ */
let field = new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshBasicMaterial({color:0x1e7b1e})
);
field.rotation.x = -Math.PI/2;
scene.add(field);

/* СТАДИОН (лёгкий) */
let stadium = new THREE.Mesh(
new THREE.CylinderGeometry(120,120,30,32,1,true),
new THREE.MeshBasicMaterial({color:0x333333,side:THREE.DoubleSide})
);
stadium.position.y=15;
scene.add(stadium);

/* ИГРОК (Box вместо Capsule) */
let player = new THREE.Mesh(
new THREE.BoxGeometry(1,2,1),
new THREE.MeshBasicMaterial({color:0x00aaff})
);
player.position.y=1;
scene.add(player);

/* МЯЧ */
let ball = new THREE.Mesh(
new THREE.SphereGeometry(0.5,16,16),
new THREE.MeshBasicMaterial({color:0xffffff})
);
ball.position.set(0,0.5,-10);
scene.add(ball);

/* ДВИЖЕНИЕ */
let moveX=0,moveZ=0;
let velocityY=0,onGround=true;
let hasBall=false;

/* ДЖОЙСТИК */
let joystick=document.getElementById("joystick");
let stick=document.getElementById("stick");
let drag=false;

joystick.ontouchstart=()=>drag=true;
joystick.ontouchend=()=>{
drag=false;
moveX=0;moveZ=0;
stick.style.left="30px";
stick.style.top="30px";
};

joystick.ontouchmove=(e)=>{
if(!drag)return;
let r=joystick.getBoundingClientRect();
let x=e.touches[0].clientX-r.left-60;
let y=e.touches[0].clientY-r.top-60;
let max=40;
let d=Math.sqrt(x*x+y*y);
if(d>max){x=x/d*max;y=y/d*max;}
stick.style.left=(x+30)+"px";
stick.style.top=(y+30)+"px";
moveX=x/40;
moveZ=y/40;
};

/* ПРЫЖОК */
jumpBtn.onclick=()=>{
if(onGround){velocityY=0.25;onGround=false;}
};

/* LOOP */
function animate(){
requestAnimationFrame(animate);

/* движение */
player.position.x+=moveX*0.4;
player.position.z+=moveZ*0.4;

/* гравитация */
player.position.y+=velocityY;
velocityY-=0.015;
if(player.position.y<=1){
player.position.y=1;
velocityY=0;
onGround=true;
}

/* мяч берётся */
if(player.position.distanceTo(ball.position)<2){
hasBall=true;
}
if(hasBall){
ball.position.x=player.position.x;
ball.position.z=player.position.z-1;
}

/* камера */
camera.position.x=player.position.x;
camera.position.z=player.position.z+10;
camera.lookAt(player.position);

renderer.render(scene,camera);
}

animate();

/* RESIZE */
window.onresize=()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
};

</script>
</body>
</html>
